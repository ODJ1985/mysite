<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8860B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#1a1a1a" rx="80"/>
  
  <!-- Main decorative frame -->
  <rect x="40" y="40" width="432" height="432" fill="none" stroke="url(#goldGradient)" stroke-width="8" rx="40"/>
  
  <!-- Corner decorations -->
  <g stroke="url(#goldGradient)" stroke-width="4" fill="none">
    <!-- Top left corner -->
    <path d="M80 80 L80 120 M80 80 L120 80"/>
    <path d="M90 90 L90 110 M90 90 L110 90"/>
    
    <!-- Top right corner -->
    <path d="M432 80 L432 120 M432 80 L392 80"/>
    <path d="M422 90 L422 110 M422 90 L402 90"/>
    
    <!-- Bottom left corner -->
    <path d="M80 432 L80 392 M80 432 L120 432"/>
    <path d="M90 422 L90 402 M90 422 L110 422"/>
    
    <!-- Bottom right corner -->
    <path d="M432 432 L432 392 M432 432 L392 432"/>
    <path d="M422 422 L422 402 M422 422 L402 422"/>
  </g>
  
  <!-- Microphone and audio equipment -->
  <g fill="url(#goldGradient)" transform="translate(156, 120)">
    <!-- Microphone -->
    <circle cx="100" cy="80" r="30"/>
    <rect x="95" y="110" width="10" height="50"/>
    <rect x="85" y="160" width="30" height="10" rx="5"/>
    
    <!-- Headphones/Audio symbol -->
    <path d="M60 60 Q60 30 100 30 Q140 30 140 60" stroke="url(#goldGradient)" stroke-width="12" fill="none"/>
    <circle cx="65" cy="65" r="15"/>
    <circle cx="135" cy="65" r="15"/>
  </g>
  
  <!-- Japanese characters 和風 -->
  <g fill="url(#goldGradient)" font-family="serif" font-size="60" font-weight="bold">
    <text x="360" y="190" text-anchor="middle">和</text>
    <text x="360" y="270" text-anchor="middle">風</text>
  </g>
  
  <!-- WYEBIYA text -->
  <text x="256" y="410" text-anchor="middle" fill="url(#goldGradient)" font-family="serif" font-size="42" font-weight="bold" letter-spacing="3">WYEBIYA</text>
</svg>
